<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --font: 'Gotham', 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --ground: #F7F6F3;
  --surface: #FFFFFF;
  --surface-2: #EFECE6;
  --seg: #ECE8E1;
  --ink: #1F1D1A;
  --text-2: #3A3631;
  --muted: #6B665E;
  --line: #E4E0D8;
  --line-soft: #ECE9E3;
  --border: #D9D4CC;
  --accent: #7A6853;
  --on-ink: #F7F6F3;
  --track-off: #C9C2B8;
  --mix-1: #7A6853;
  --mix-2: #1F1D1A;
  --mix-3: #A89C8C;
  --mix-4: #C7BEB1;
  --mix-5: #DDD6CB;
  --av1: #DCD5CA; --av2: #D9CFC4; --av3: #CDD2D6; --av4: #D8CDCB; --av5: #D3D3C6; --av6: #D2CED6;
  --scrim: rgba(31, 29, 26, 0.4);
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #161513; --surface: #1F1D1A; --surface-2: #2A2723; --seg: #24221E;
    --ink: #F2EFE9; --text-2: #D8D3CA; --muted: #A39E95; --line: #34302B; --line-soft: #2B2824;
    --border: #3F3A34; --accent: #C7B49A; --on-ink: #161513; --track-off: #4A453E;
    --mix-1: #C7B49A; --mix-2: #F2EFE9; --mix-3: #8C8172; --mix-4: #6A6157; --mix-5: #4A443D;
    --av1: #3A352E; --av2: #3B3430; --av3: #30353A; --av4: #3A3132; --av5: #34352D; --av6: #35323A;
    --scrim: rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  --ground: #161513; --surface: #1F1D1A; --surface-2: #2A2723; --seg: #24221E;
  --ink: #F2EFE9; --text-2: #D8D3CA; --muted: #A39E95; --line: #34302B; --line-soft: #2B2824;
  --border: #3F3A34; --accent: #C7B49A; --on-ink: #161513; --track-off: #4A453E;
  --mix-1: #C7B49A; --mix-2: #F2EFE9; --mix-3: #8C8172; --mix-4: #6A6157; --mix-5: #4A443D;
  --av1: #3A352E; --av2: #3B3430; --av3: #30353A; --av4: #3A3132; --av5: #34352D; --av6: #35323A;
  --scrim: rgba(0, 0, 0, 0.55);
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--ground); scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font-family: inherit; }
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

/* Layout */
.app { max-width: 440px; min-height: 100%; margin: 0 auto; }
.screen { padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 22px; }
.screen.has-tabs { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.screen.has-dock { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.screen--welcome { min-height: 100%; justify-content: space-between; padding: 40px 24px 28px; gap: 32px; }
.stack-lg { display: flex; flex-direction: column; gap: 32px; }
.stack-md { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; }
.stack-xs { display: flex; flex-direction: column; gap: 6px; }
.stack-2 { display: flex; flex-direction: column; gap: 2px; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.center { text-align: center; align-items: center; }

/* Type */
.wordmark { font-weight: 600; font-size: 18px; letter-spacing: 0.32em; text-transform: uppercase; }
.wordmark--xl { font-size: 34px; letter-spacing: 0.3em; line-height: 1; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.eyebrow--accent { color: var(--accent); font-weight: 700; }
.title { margin: 0; font-size: 40px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
.h-xl { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.12; letter-spacing: -0.02em; }
.h2 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.lede { margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted); }
.small { font-size: 12px; color: var(--muted); line-height: 1.45; }
.fine { margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; }
.opt-title { font-size: 15px; font-weight: 600; color: var(--ink); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Controls */
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.icon-btn { width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--border); background: transparent; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; text-decoration: none; }
.icon-btn--solid { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn { width: 100%; min-height: 54px; padding: 0 20px; border-radius: 27px; border: 1px solid transparent; font-size: 16px; font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; cursor: pointer; }
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--outline { background: transparent; color: var(--ink); border-color: var(--border); min-height: 48px; font-size: 15px; font-weight: 600; }
.btn--sm { width: auto; min-height: 44px; padding: 0 18px; border-radius: 22px; font-size: 14px; font-weight: 600; }
.btn--text { width: auto; min-height: 44px; padding: 0; background: none; border: 0; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; align-self: center; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.row-btns.full > * { flex: 1; }
.pill { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.pill--accent { color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--seg); border-radius: 14px; }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--border); background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; }

/* Cards and rows */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.card--tight { gap: 10px; }
.card-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-note { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.45; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.card-note svg { flex-shrink: 0; margin-top: 1px; }
.rank-num { font-size: 42px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: lining-nums tabular-nums; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.stat-big { font-size: 20px; font-weight: 600; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; min-height: 66px; border-bottom: 1px solid var(--line-soft); }
.row:last-child { border-bottom: 0; }
.row .rank { width: 24px; flex-shrink: 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.name-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.amount { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.amount--muted { color: var(--muted); }
.move { font-size: 12px; font-weight: 600; color: var(--muted); }
.move--up { color: var(--accent); }
.status-flag { font-size: 12px; font-weight: 600; color: var(--accent); }
.verified { flex-shrink: 0; }
.verified circle { fill: var(--ink); }
.verified path { fill: none; stroke: var(--ground); }
.avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink); flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar--ring { border: 2px solid var(--accent); }
.icon-box { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Welcome */
.ladder { display: flex; flex-direction: column; }
.ladder-row { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; padding-bottom: 12px; border-top: 1px solid var(--line); font-size: 24px; font-weight: 500; letter-spacing: -0.01em; }
.ladder-row:last-child { border-bottom: 1px solid var(--line); }
.ladder-hash { color: var(--accent); font-size: 20px; }

/* Onboarding */
.step-head { display: flex; align-items: center; gap: 14px; }
.progress { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.progress span { height: 4px; border-radius: 2px; background: var(--line); }
.progress span.on { background: var(--accent); }
.opts { display: flex; flex-direction: column; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 0; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.opt:last-child { border-bottom: 0; }
.linked { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
.chev { color: var(--muted); display: inline-flex; flex-shrink: 0; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.note p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.note svg { flex-shrink: 0; margin-top: 1px; }
.dock { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 440px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ground); border-top: 1px solid var(--line); z-index: 10; }
.photo-row { display: flex; align-items: center; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 13px; font-weight: 600; }
.input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 16px; }
.textarea { min-height: 128px; padding: 12px 14px; line-height: 1.5; resize: none; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
legend { padding: 0; margin-bottom: 10px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.radio { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; }
.radio.is-on { border-color: var(--accent); background: var(--surface); }
.radio input { width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--accent); }
.switch-row { display: flex; align-items: center; gap: 14px; min-height: 72px; border-bottom: 1px solid var(--line-soft); }
.switch { min-width: 56px; min-height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.switch .track { width: 52px; height: 32px; border-radius: 16px; padding: 3px; background: var(--track-off); display: flex; justify-content: flex-start; transition: background-color 0.2s; }
.switch[aria-checked="true"] .track { background: var(--accent); justify-content: flex-end; }
.switch .knob { width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }

/* Feed */
.update-text { margin: 0; font-size: 21px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }
.post { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
.post-head { display: flex; align-items: center; gap: 12px; }
.post-rank { font-size: 18px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
.post-label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.post-title { font-size: 19px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }
.post-body { margin: 0; font-size: 15px; line-height: 1.55; color: var(--text-2); overflow-wrap: anywhere; white-space: pre-wrap; }
.actions { display: flex; align-items: center; gap: 4px; margin-left: -10px; }
.act { min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.act[aria-pressed="true"] { color: var(--accent); }
.act[aria-pressed="true"] svg path { fill: currentColor; }
.act--end { margin-left: auto; }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 12px 0; }

/* Wealth */
.big-num { margin: 0; font-size: 40px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; }
.totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.total { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mix-bar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; row-gap: 8px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.push { margin-left: auto; }

/* Profile */
.profile-head { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.avatar-wrap { position: relative; width: 104px; height: 104px; }
.camera { position: absolute; right: -6px; bottom: -6px; width: 44px; height: 44px; border-radius: 22px; border: 3px solid var(--ground); background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.profile-name { margin: 0; font-size: 30px; font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.counts { display: flex; gap: 24px; font-size: 14px; color: var(--muted); }
.counts strong { color: var(--ink); font-size: 16px; }
.nw { font-size: 40px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: lining-nums; }
.inline-link { color: var(--ink); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.tile-rank { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--accent); font-variant-numeric: lining-nums; }
.only-you { align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 11px; font-weight: 600; color: var(--muted); }

/* Tab bar, sheet, toast */
.tabbar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 440px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--ground); border-top: 1px solid var(--line); z-index: 10; }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.03em; }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tabbar a[aria-current="page"] svg { color: var(--accent); }
.sheet-backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 440px; background: var(--ground); border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-head, .sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); max-width: calc(100% - 40px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 13px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>

</nav>

<script>
(function () {
  'use strict';

  /* ---------- Saved state (this phone only) ---------- */
  var KEY = 'wealthy-test-v1';
  var DEFAULTS = {

    amount: 'range', loc: 'state', board: true, follow: true,
    linked: { bank: true, invest: true, home: false, car: false, crypto: false, debts: false, other: false },

    return '<article class="post">' +
      '<div class="post-head">' + avatarHTML(ini, mine ? S.photo : null, 40) + '<div class="grow"><div class="name-line"><span class="name">' + esc(name) + '</span>' + VERIFIED + '</div><span class="small">' + esc(where) + ' · ' + esc(time) + '</span></div>' + (p.rank ? '<span class="post-rank">' + p.rank + '</span>' : '') + '</div>' +
      (p.title ? '<div class="stack-xs"><span class="post-label">' + esc(p.label) + '</span><span class="post-title">' + esc(p.title) + '</span></div>' : '') +
      (p.body ? '<p class="post-body">' + esc(p.body) + '</p>' : '') +
      '<div class="actions">' +
        '<button class="act" data-action="cheer" data-id="' + esc(p.id) + '" aria-pressed="' + cheered + '" aria-label="Cheer, ' + cheers + ' cheers">' + I.star + '<span>' + fmtCount(cheers) + '</span></button>' +
        '<button class="act" data-action="soon" data-msg="Comments aren\'t in this test version yet." aria-label="' + comments + ' comments">' + I.comment + '<span>' + fmtCount(comments) + '</span></button>' +
        '<button class="act" data-action="share" aria-label="Share">' + I.share + '</button>' +
        (mine ? '<button class="act act--end" data-action="delete-post" data-id="' + esc(p.id) + '">Delete</button>' : '') +
      '</div></article>';
  }
  function updateCard() {
    var u = UPDATES[S.loc];
    return '<section class="card card--tight" aria-label="Your update"><span class="eyebrow eyebrow--accent">This month</span>' +
      '<p class="update-text">You climbed ' + u.places + ' places in ' + u.where + '. You\'re now ' + u.rank + '.</p>' +
      '<div class="row-btns">' + (S.board ? '<button class="btn btn--primary btn--sm" data-action="share-rank">Share to feed</button>' : '') + '<a class="btn btn--outline btn--sm" href="#rankings">See rankings</a></div></section>';
  }
  function feed() {
    var filters = [['following', 'Following'], ['austin', 'Austin'], ['texas', 'Texas'], ['milestones', 'Milestones']];
    var titles = { following: 'Following', austin: 'Austin', texas: 'Texas', milestones: 'Milestones' };
    var posts = visiblePosts();
    var chips = filters.map(function (f) { return '<button class="chip-btn" data-action="filter" data-filter="' + f[0] + '" aria-pressed="' + (f[0] === UI.feed) + '">' + f[1] + '</button>'; }).join('');
    var list = posts.length ? posts.map(postHTML).join('') :
      '<div class="empty"><p class="lede">No posts here yet.</p><button class="btn btn--outline btn--sm" data-action="compose">Write a post</button></div>';
    return '<section class="screen has-tabs">' +
      topbar('<button class="icon-btn" data-action="compose" aria-label="Write a post">' + I.plus + '</button>') +
      '<div class="stack-xs"><span class="eyebrow">Feed</span><h1 class="title">' + titles[UI.feed] + '</h1></div>' +
      '<div class="chips-row" role="group" aria-label="Filter feed">' + chips + '</div>' +
      (UI.feed === 'following' ? updateCard() : '') + list +
      '</section>';
  }

  function wealth() {
    var bar = MIX.map(function (m) { return '<span style="flex:' + m.w + ' 1 0;background:var(' + m.c + ')"></span>'; }).join('');
    var legend = MIX.map(function (m) { return '<div class="legend-item"><span class="swatch" style="background:var(' + m.c + ')"></span><span>' + m.label + '</span><span class="small push">' + m.pct + '</span></div>'; }).join('');
    return '<section class="screen has-tabs">' +
      topbar('<a class="icon-btn icon-btn--solid" href="#add" aria-label="Add an asset or debt">' + I.plus + '</a>') +
      '<div class="stack-xs"><span class="eyebrow">Your wealth</span><h1 class="big-num">$2,413,870</h1><span class="small">Verified net worth · updated today, 6:02 AM</span></div>' +
      '<div class="totals"><div class="stack-2"><span class="eyebrow">Assets</span><span class="total">$3,263,000</span></div><div class="stack-2"><span class="eyebrow">Liabilities</span><span class="total">−$849,130</span></div></div>' +
      '<section class="stack-md" aria-label="Asset mix"><div class="mix-bar" aria-hidden="true">' + bar + '</div><div class="legend">' + legend + '</div></section>' +
      '<section aria-label="Assets"><div class="list-head"><h2 class="h2">Assets</h2><span class="small">Status</span></div>' + ASSETS.map(itemRow).join('') + '</section>' +
      '<section aria-label="Liabilities"><div class="list-head"><h2 class="h2">Liabilities</h2><span class="small">Subtracted from net worth</span></div>' + DEBTS.map(itemRow).join('') + '</section>' +
      '<p class="fine">Sample data for testing.</p>' +
      '</section>';
  }

  function profile() {
    var ini = initials(S.name);
    var tiles = TILES.map(function (t) {
      var hidden = !S.board || (t.level === 'city' && S.loc !== 'city') || (t.level === 'state' && S.loc === 'country');
      return '<div class="tile"><span class="eyebrow">' + t.label + '</span><span class="tile-rank">' + t.rank + '</span><span class="small">' + t.top + '</span>' + (hidden ? '<span class="only-you">Only you</span>' : '') + '</div>';
    }).join('');
    var milestones = ['Crossed $1M', 'Top 5% in Austin', 'Top 5% in Texas'].map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('');
    return '<section class="screen has-tabs">' +
      topbar('<a class="icon-btn" href="#settings" aria-label="Privacy and display settings">' + I.sliders + '</a>') +
      '<div class="profile-head">' +
        '<div class="avatar-wrap">' + avatarHTML(ini, S.photo, 104, true) + '<label class="camera" for="photo-input-profile"><span class="sr">Change profile photo</span>' + I.camera + '</label><input class="sr-file" type="file" id="photo-input-profile" accept="image/*" data-photo></div>' +
        '<div class="stack-xs center"><h1 class="profile-name">' + esc(S.name) + '</h1><span class="small">@' + esc(handleFor(S.name)) + ' · ' + myWhere() + ' · Joined Mar 2026</span></div>' +
        '<div class="counts"><span><strong>1,204</strong> followers</span><span><strong>312</strong> following</span></div>' +
        '<div class="row-btns full" style="width:100%"><a class="btn btn--outline btn--sm" href="#settings">Edit profile</a><button class="btn btn--outline btn--sm" data-action="share-profile">Share profile</button></div>' +
      '</div>' +
      '<section class="card card--tight" aria-label="Net worth"><div class="card-top"><span class="eyebrow">Net worth</span><span class="pill">' + publicAs() + '</span></div><span class="nw">$2.41M</span><span class="small">Only you see the exact figure. <a class="inline-link" href="#wealth">See breakdown</a></span></section>' +
      '<section class="stack-md" aria-label="Where you stand"><h2 class="h2">Where you stand</h2><div class="tiles">' + tiles + '</div></section>' +
      '<section class="stack-md" aria-label="Milestones"><h2 class="h2">Milestones</h2><div class="chips">' + milestones + '</div></section>' +
      '</section>';
  }

  /* ---------- Rendering and routing ---------- */
  var VIEWS = {
    welcome: welcome,
    connect: function () { return connectView('onboarding'); },
    add: function () { return connectView('add'); },
    privacy: function () { return privacyView('onboarding'); },
    settings: function () { return privacyView('settings'); },
    rankings: rankings, feed: feed, wealth: wealth, profile: profile
  };
  var TITLES = { welcome: 'Wealthy', connect: 'Add what you own · Wealthy', add: 'Add what you own · Wealthy', privacy: 'How you appear · Wealthy', settings: 'How you appear · Wealthy', rankings: 'Rankings · Wealthy', feed: 'Feed · Wealthy', wealth: 'Your wealth · Wealthy', profile: 'Profile · Wealthy' };
  var TABS = ['rankings', 'feed', 'wealth', 'profile'];
  var root = document.getElementById('app');
  var tabbar = document.getElementById('tabbar');
  var sheetRoot = document.getElementById('sheet-root');

  function current() {
    var h = decodeURIComponent(location.hash.slice(1));
    if (Object.prototype.hasOwnProperty.call(VIEWS, h)) return h;
    return S.onboarded ? 'rankings' : 'welcome';
  }
  function go(screen) {
    if (location.hash.slice(1) === screen) render();
    else location.hash = screen;
  }
  function render() {
    var scr = current();
    root.innerHTML = VIEWS[scr]();
    var isTab = TABS.indexOf(scr) !== -1;
    tabbar.hidden = !isTab;
    Array.prototype.forEach.call(tabbar.querySelectorAll('a'), function (a) {
      if (a.getAttribute('data-tab') === scr) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    document.title = TITLES[scr];
    renderSheet();
    if (UI.last !== scr) { window.scrollTo(0, 0); UI.last = scr; }
  }
  function renderSheet() {
    if (!UI.sheet) { sheetRoot.innerHTML = ''; return; }
    sheetRoot.innerHTML = '<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-head"><h2 class="h2" id="sheet-title">Write a post</h2><button class="icon-btn" data-action="close-sheet" aria-label="Close">' + I.close + '</button></div>' +
      '<label class="sr" for="compose-text">Post text</label><textarea class="input textarea" id="compose-text" maxlength="500" placeholder="Share a milestone or a thought"></textarea>' +
      '<div class="sheet-foot"><span class="small" id="compose-count">0 / 500</span><button class="btn btn--primary btn--sm" data-action="post">Post</button></div>' +
      '</div></div>';
    setTimeout(function () { var t = document.getElementById('compose-text'); if (t) t.focus(); }, 60);
  }

  /* ---------- Photos ---------- */
  function readPhoto(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var size = 320;
          var c = document.createElement('canvas');
          c.width = size; c.height = size;
          var m = Math.min(img.naturalWidth, img.naturalHeight);
          c.getContext('2d').drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, size, size);
          resolve(c.toDataURL('image/jpeg', 0.86));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ---------- Sharing ---------- */
  function shareLink(text) {
    var url = location.href.split('#')[0];
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { toast('Copy the address bar to share this page.'); });
      } else { toast('Copy the address bar to share this page.'); }
    }
    if (navigator.share) {
      navigator.share({ title: 'Wealthy', text: text, url: url }).catch(function (e) { if (!e || e.name !== 'AbortError') copy(); });
    } else { copy(); }
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    if (el.classList.contains('sheet-backdrop') && e.target !== el) return;

    if (a === 'go') { go(el.getAttribute('data-to')); }
    else if (a === 'login') { S.onboarded = true; save(); go('rankings'); }
    else if (a === 'finish') {
      if (!S.name.trim()) S.name = 'New member';
      S.onboarded = true; save(); go('rankings'); toast('Profile saved');
    }
    else if (a === 'save-settings') {
      if (!S.name.trim()) S.name = 'New member';
      save(); go('profile'); toast('Changes saved');
    }
    else if (a === 'scope') { UI.scope = el.getAttribute('data-scope'); render(); }
    else if (a === 'filter') { UI.feed = el.getAttribute('data-filter'); render(); }
    else if (a === 'toggle-link') {
      var id = el.getAttribute('data-id');
      S.linked[id] = !S.linked[id]; save(); render();
      var cat = CATS.filter(function (c) { return c.id === id; })[0];
      toast(cat.title + (S.linked[id] ? (id === 'other' ? ' added' : ' linked') : ' removed'));
    }
    else if (a === 'toggle') {
      var key = el.getAttribute('data-key');
      S[key] = !S[key]; save(); render();
    }
    else if (a === 'cheer') {
      var pid = el.getAttribute('data-id');
      var i = S.cheered.indexOf(pid);
      if (i === -1) S.cheered.push(pid); else S.cheered.splice(i, 1);
      save(); render();
    }
    else if (a === 'compose') { UI.sheet = true; renderSheet(); }
    else if (a === 'close-sheet') { UI.sheet = false; renderSheet(); }
    else if (a === 'post') {
      var t = document.getElementById('compose-text');
      var body = t ? t.value.trim() : '';
      if (!body) { toast('Write something first'); return; }
      S.myPosts.unshift({ id: 'm' + Date.now(), at: Date.now(), body: body, cheers: 0, comments: 0 });
      save(); UI.sheet = false; UI.feed = 'following'; go('feed'); render(); toast('Posted');
    }
    else if (a === 'share-rank') {
      var u = UPDATES[S.loc];
      S.myPosts.unshift({ id: 'm' + Date.now(), at: Date.now(), label: 'Milestone', title: 'Climbed ' + u.places + ' places in ' + u.where + ' this month', body: null, cheers: 0, comments: 0, milestone: true });
      save(); render(); toast('Shared to your feed');
    }
    else if (a === 'delete-post') {
      var did = el.getAttribute('data-id');
      S.myPosts = S.myPosts.filter(function (p) { return p.id !== did; });
      save(); render(); toast('Post deleted');
    }
    else if (a === 'share') { shareLink('A milestone on Wealthy'); }
    else if (a === 'share-profile') { shareLink(S.name + ' on Wealthy'); }
    else if (a === 'soon') { toast(el.getAttribute('data-msg')); }
    else if (a === 'reset') {
      if (window.confirm('Reset the test app and start over? Your test name, photo and posts on this phone will be cleared.')) {
        try { localStorage.removeItem(KEY); } catch (err) {}
        S = fresh(); UI.scope = 'city'; UI.feed = 'following'; UI.sheet = false;
        go('welcome');
      }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-group]')) {
      S[t.getAttribute('data-group')] = t.value; save(); render();
    }
    else if (t.matches('[data-photo]') && t.files && t.files[0]) {
      readPhoto(t.files[0]).then(function (url) {
        S.photo = url; save(); render(); toast('Photo updated');
      }, function () { toast("That photo couldn't be opened. Try a JPEG or PNG."); });
    }
    else if (t.id === 'name-input') {
      if (!S.name.trim()) S.name = 'New member';
      save(); render();
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'name-input') { S.name = t.value.slice(0, 50); save(); }
    else if (t.id === 'compose-text') {
      var c = document.getElementById('compose-count');
      if (c) c.textContent = t.value.length + ' / 500';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && UI.sheet) { UI.sheet = false; renderSheet(); }
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
