:root {
  --font: 'Gotham', 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --ground: #F7F6F3;
  --surface: #FFFFFF;
  --surface-2: #EFECE6;
  --seg: #ECE8E1;
  --ink: #1F1D1A;
  --text-2: #3A3631;
  --muted: #67625A;
  --line: #E4E0D8;
  --line-soft: #ECE9E3;
  --border: #D9D4CC;
  --field-border: #8E877D;
  --accent: #76644F;
  --on-ink: #F7F6F3;
  --track-off: #8E877D;
  --knob-on: #FFFFFF;
  --error: #A3392B;
  --on-error: #FFFFFF;
  --mix-1: #76644F; --mix-2: #1F1D1A; --mix-3: #A89C8C; --mix-4: #C7BEB1; --mix-5: #DDD6CB;
  --av1: #DCD5CA; --av2: #D9CFC4; --av3: #CDD2D6; --av4: #D8CDCB; --av5: #D3D3C6; --av6: #D2CED6;
  --scrim: rgba(31, 29, 26, 0.4);
  --bill: #B9C2AE; --bill-edge: #7E8A72; --coin: #D6BF8E; --coin-edge: #9C8150;
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #161513; --surface: #1F1D1A; --surface-2: #2A2723; --seg: #24221E;
    --ink: #F2EFE9; --text-2: #D8D3CA; --muted: #A8A399; --line: #34302B; --line-soft: #2B2824;
    --border: #3F3A34; --field-border: #7A746A; --accent: #C7B49A; --on-ink: #161513;
    --track-off: #7A746A; --knob-on: #161513; --error: #F2A193; --on-error: #161513;
    --mix-1: #C7B49A; --mix-2: #F2EFE9; --mix-3: #8C8172; --mix-4: #6A6157; --mix-5: #4A443D;
    --av1: #3A352E; --av2: #3B3430; --av3: #30353A; --av4: #3A3132; --av5: #34352D; --av6: #35323A;
    --scrim: rgba(0, 0, 0, 0.55);
    --bill: #56624F; --bill-edge: #94A288; --coin: #8A7650; --coin-edge: #CDB78F;
  }
}
:root[data-theme="dark"] {
  --ground: #161513; --surface: #1F1D1A; --surface-2: #2A2723; --seg: #24221E;
  --ink: #F2EFE9; --text-2: #D8D3CA; --muted: #A8A399; --line: #34302B; --line-soft: #2B2824;
  --border: #3F3A34; --field-border: #7A746A; --accent: #C7B49A; --on-ink: #161513;
  --track-off: #7A746A; --knob-on: #161513; --error: #F2A193; --on-error: #161513;
  --mix-1: #C7B49A; --mix-2: #F2EFE9; --mix-3: #8C8172; --mix-4: #6A6157; --mix-5: #4A443D;
  --av1: #3A352E; --av2: #3B3430; --av3: #30353A; --av4: #3A3132; --av5: #34352D; --av6: #35323A;
  --scrim: rgba(0, 0, 0, 0.55);
    --bill: #56624F; --bill-edge: #94A288; --coin: #8A7650; --coin-edge: #CDB78F;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--ground); scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font-family: inherit; }
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1:focus, h1:focus-visible { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.skip-link { position: fixed; left: 12px; top: -80px; z-index: 60; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--on-ink); font-weight: 600; text-decoration: none; }
.skip-link:focus { top: calc(8px + env(safe-area-inset-top, 0px)); }

/* Layout */
.app { display: block; max-width: 440px; min-height: 100%; margin: 0 auto; }
.screen { padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 22px; }
.screen.has-tabs { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.screen.has-dock { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.screen--welcome { min-height: 100%; justify-content: space-between; padding: 16px 24px 24px; gap: 28px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.stack-md { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 12px; }
.stack-xs { display: flex; flex-direction: column; gap: 6px; }
.stack-2 { display: flex; flex-direction: column; gap: 2px; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.center { text-align: center; align-items: center; }

/* Type */
.wordmark { font-weight: 600; font-size: 18px; letter-spacing: 0.32em; text-transform: uppercase; }
.wordmark--xl { font-size: 34px; letter-spacing: 0.3em; line-height: 1; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.eyebrow--accent { color: var(--accent); font-weight: 700; }
.title { margin: 0; font-size: 40px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
.h-xl { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.12; letter-spacing: -0.02em; }
.h2 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.lede { margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted); }
.small { font-size: 12px; color: var(--muted); line-height: 1.45; }
.fine { margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; }
.opt-title { font-size: 15px; font-weight: 600; color: var(--ink); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-bar { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12px; line-height: 1.45; color: var(--muted); }
.demo-bar strong { color: var(--ink); font-weight: 600; }
.error { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.45; color: var(--error); }

/* Controls */
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.icon-btn { width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid var(--border); background: transparent; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; text-decoration: none; }
.icon-btn--solid { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn { width: 100%; min-height: 54px; padding: 0 20px; border-radius: 27px; border: 1px solid transparent; font-size: 16px; font-weight: 700; line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; cursor: pointer; }
.btn--primary { background: var(--ink); color: var(--on-ink); }
.btn--outline { background: transparent; color: var(--ink); border-color: var(--border); min-height: 48px; font-size: 15px; font-weight: 600; }
.btn--danger { background: var(--error); color: var(--on-error); }
.btn--sm { width: auto; min-height: 44px; padding: 0 18px; border-radius: 22px; font-size: 14px; font-weight: 600; }
.btn--text { width: auto; min-height: 44px; padding: 0; background: none; border: 0; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.row-btns.full > * { flex: 1; }
.pill { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.pill--accent { color: var(--accent); }

  function go(screen) {
    if (location.hash.slice(1) === screen) render();
    else location.hash = screen;
  }
  function focusKey(el) {
    if (!el || el === document.body || !root.contains(el) && !consentRoot.contains(el)) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    var a = el.getAttribute('data-action');
    if (!a) return null;
    var sel = '[data-action="' + a + '"]';
    ['data-id', 'data-handle', 'data-scope', 'data-filter', 'data-key', 'data-value', 'data-target'].forEach(function (n) {
      var v = el.getAttribute(n);
      if (v != null) sel += '[' + n + '="' + CSS.escape(v) + '"]';
    });
    return sel;
  }
  function render() {
    var scr = current();
    var changed = UI.last !== scr;
    var key = changed ? null : focusKey(document.activeElement);
    if (changed && scr === 'feed') startFeedLoad();
    root.innerHTML = VIEWS[scr]();
    var isTab = TABS.indexOf(scr) !== -1;
    tabbar.hidden = !isTab;
    Array.prototype.forEach.call(tabbar.querySelectorAll('a'), function (a) {
      if (a.getAttribute('data-tab') === scr) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    document.title = TITLES[scr];
    renderSheet();
    renderConsent();
    renderPill();
    if (changed) {
      var first = UI.last === null;
      UI.last = scr;
      window.scrollTo(0, 0);
      if (!first) { var h1 = root.querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); }
    } else if (key) {
      var again = document.querySelector(key);
      if (again) again.focus({ preventScroll: true });
    }
  }

  /* ---------- Photos ---------- */
  function readPhoto(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var size = 320;
          var c = document.createElement('canvas');
          c.width = size; c.height = size;
          var m = Math.min(img.naturalWidth, img.naturalHeight);
          c.getContext('2d').drawImage(img, (img.naturalWidth - m) / 2, (img.naturalHeight - m) / 2, m, m, 0, 0, size, size);
          resolve(c.toDataURL('image/jpeg', 0.86)); // re-encoding also strips location and camera metadata
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ---------- Sharing and data ---------- */
  function shareLink(text) {
    var url = location.href.split('#')[0];
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { toast('Copy the address bar to share this page.'); });
      } else { toast('Copy the address bar to share this page.'); }
    }
    if (navigator.share) {
      navigator.share({ title: 'Wealthy', text: text, url: url }).catch(function (e) { if (!e || e.name !== 'AbortError') copy(); });
    } else { copy(); }
  }
  function downloadData() {
    var data = {
      exported_at: new Date().toISOString(),
      about: 'Everything the Wealthy test app has stored on this device. Nothing was sent to a server.',
      profile: { display_name: displayName(), handle: handleFor(displayName()), photo: S.photo ? 'Included as a data URL in profile_photo' : null },
      profile_photo: S.photo,
      display_choices: { net_worth_shown_as: S.amount, location_shown_as: S.loc, on_public_leaderboards: S.board, allow_follows: S.follow },
      age_check: S.ageConfirmedAt ? { confirmed_18_or_older_at: S.ageConfirmedAt, date_of_birth_stored: false } : null,
      agreements: S.consents,
      email_preferences: { product_news: S.marketing },
      cookie_choices: C,
      test_links_marked: S.linked,
      your_posts: S.myPosts,
      posts_you_cheered: S.cheered
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'wealthy-my-data.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast('Your data file is downloading');
  }
  function eraseEverything() {
    try { localStorage.removeItem(KEY); localStorage.removeItem(CONSENT_KEY); } catch (e) {}
    S = fresh(); C = null;
    UI.scope = 'city'; UI.feedTab = 'foryou'; UI.live = []; UI.pending = []; UI.queue = INCOMING.slice(); UI.form = { error: '', dobError: '' }; UI.showConsent = false;
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    if (el.classList.contains('sheet-backdrop') && e.target !== el) return;
    if (el.tagName === 'A') e.preventDefault();

    if (a === 'skip') { var h1 = root.querySelector('h1'); if (h1) h1.focus(); }
    else if (a === 'login') { toast('There are no accounts in this test version. Create a test account instead.'); }
    else if (a === 'create-account') {
      var dob = document.getElementById('dob').value;
      var terms = document.getElementById('agree-terms').checked;
      var marketing = document.getElementById('agree-marketing').checked;
      var age = ageOn(dob);
      UI.form = { dob: dob, terms: terms, marketing: marketing, dobError: '', termsError: '' };
      if (age === null) UI.form.dobError = 'Enter your date of birth.';
      if (!terms) UI.form.termsError = 'To continue, agree to the Terms of Service and confirm you\'ve read the Privacy Policy.';
      if (UI.form.dobError || UI.form.termsError) {
        render();
        var bad = document.querySelector('[aria-invalid="true"]');
        if (bad) bad.focus();
        return;
      }
      UI.form = { error: '', dobError: '' }; // the date of birth is discarded here and never saved
      if (age < 18) { S.underageAt = new Date().toISOString(); save(); go('underage'); return; }
      var now = new Date().toISOString();
      S.ageConfirmedAt = now;
      S.consents = { terms_version: TERMS_VERSION, privacy_version: PRIVACY_VERSION, accepted_at: now };
      S.marketing = marketing;
      save(); go('connect');
    }
    else if (a === 'finish') { S.onboarded = true; save(); go('rankings'); runSplash(true); toast('Profile saved'); }
    else if (a === 'save-settings') { save(); go('profile'); toast('Changes saved'); }
    else if (a === 'scope') { UI.scope = el.getAttribute('data-scope'); render(); }
    else if (a === 'feed-tab') { UI.feedTab = el.getAttribute('data-key'); startFeedLoad(); render(); }
    else if (a === 'follow') {
      var hnd = el.getAttribute('data-handle');
      var fi = S.following.indexOf(hnd);
      if (fi === -1) S.following.push(hnd); else S.following.splice(fi, 1);
      save(); render(); announce((fi === -1 ? 'Following ' : 'Unfollowed ') + '@' + hnd);
    }
    else if (a === 'repost') {
      var rid = el.getAttribute('data-id');
      var ri = S.reposted.indexOf(rid);
      if (ri === -1) S.reposted.push(rid); else S.reposted.splice(ri, 1);
      save(); render();
    }
    else if (a === 'reply') { toast("Replies aren't in this test version yet."); }
    else if (a === 'show-new') {
      var count = UI.pending.length;
      UI.justAdded = UI.pending.map(function (p) { return p.id; });
      UI.live = UI.pending.map(function (p) { return Object.assign({}, p, { at: Date.now() }); }).concat(UI.live);
      UI.pending = [];
      UI.feedTab = 'foryou';
      render();
      window.scrollTo(0, 0);
      var ft = document.getElementById('page-title');
      if (ft) ft.focus({ preventScroll: true });
      announce(count + ' new post' + (count === 1 ? '' : 's') + ' added to the top of the feed');
      setTimeout(function () { UI.justAdded = []; }, 900);
    }
    else if (a === 'toggle-link') {
      var id = el.getAttribute('data-id');
      S.linked[id] = !S.linked[id]; save(); render();
      var cat = CATS.filter(function (c) { return c.id === id; })[0];
      toast(cat.title + (S.linked[id] ? (id === 'other' ? ' added' : ' marked as linked') : ' removed'));
    }
    else if (a === 'toggle') {
      var k = el.getAttribute('data-key');
      if (k === 'analytics') { saveConsent(!(C && C.analytics)); }
      else { S[k] = !S[k]; save(); }
      if (k === 'marketing') toast(S.marketing ? 'Subscribed to product news' : 'Unsubscribed from product news');
      render();
    }
    else if (a === 'pick-photo') { var inp = document.getElementById(el.getAttribute('data-target')); if (inp) inp.click(); }
    else if (a === 'remove-photo') { S.photo = null; save(); render(); toast('Photo removed'); }
    else if (a === 'cheer') {
      var pid = el.getAttribute('data-id');
      var i = S.cheered.indexOf(pid);
      if (i === -1) S.cheered.push(pid); else S.cheered.splice(i, 1);
      save(); render();
    }
    else if (a === 'compose') { openSheet('compose'); }
    else if (a === 'close-sheet') { closeSheet(); }
    else if (a === 'post') {
      var t = document.getElementById('compose-text');
      var body = t ? t.value.trim() : '';
      var msInput = sheetRoot.querySelector('input[name="ms"]:checked');
      var msKey = msInput && msInput.value ? msInput.value : null;
      if (!body && !msKey) { toast('Write something or pick a milestone first'); if (t) t.focus(); return; }
      S.myPosts.unshift({ id: 'm' + Date.now(), at: Date.now(), body: body || null, milestone: msKey, cheers: 0, replies: 0, reposts: 0 });
      save(); UI.sheet = null; UI.opener = null; UI.feedTab = 'foryou'; UI.justAdded = [S.myPosts[0].id]; renderSheet();
      if (current() === 'feed') render(); else go('feed');
      window.scrollTo(0, 0); toast('Posted');
      setTimeout(function () { UI.justAdded = []; }, 900);
    }
    else if (a === 'share-rank') {
      var u = UPDATES[S.loc];
      S.myPosts.unshift({ id: 'm' + Date.now(), at: Date.now(), rankText: 'Climbed ' + u.places + ' places in ' + u.where + ' this month', rank: u.rank, body: null, cheers: 0, replies: 0, reposts: 0 });
      save(); render(); toast('Shared to your feed');
    }
    else if (a === 'delete-post') {
      var did = el.getAttribute('data-id');
      S.myPosts = S.myPosts.filter(function (p) { return p.id !== did; });
      save(); render(); toast('Post deleted');
    }
    else if (a === 'share') { shareLink('A milestone on Wealthy'); }
    else if (a === 'share-profile') { shareLink(displayName() + ' on Wealthy'); }
    else if (a === 'soon') { toast(el.getAttribute('data-msg')); }
    else if (a === 'download') { downloadData(); }
    else if (a === 'delete-open') { openSheet('delete'); }
    else if (a === 'delete-confirm') { UI.sheet = null; UI.opener = null; eraseEverything(); go('deleted'); }
    else if (a === 'consent') { saveConsent(el.getAttribute('data-value') === 'all'); UI.showConsent = false; renderConsent(); render(); toast('Your choice is saved'); var m = root.querySelector('h1'); if (m) m.focus({ preventScroll: true }); }
    else if (a === 'cookie-settings') { UI.showConsent = true; renderConsent(); var b = consentRoot.querySelector('button'); if (b) b.focus(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-group]')) { S[t.getAttribute('data-group')] = t.value; save(); render(); }
    else if (t.matches('[data-photo]') && t.files && t.files[0]) {
      readPhoto(t.files[0]).then(function (url) { S.photo = url; save(); render(); toast('Photo updated'); },
        function () { toast("That photo couldn't be opened. Try a JPEG or PNG."); });
    }
    else if (t.id === 'name-input') { S.name = t.value.slice(0, 50); save(); render(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'name-input') { S.name = t.value.slice(0, 50); save(); }
    else if (t.id === 'compose-text') {
      var c = document.getElementById('compose-count');
      if (c) c.textContent = t.value.length + ' of 500 characters';
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!UI.sheet) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Tab') { // keep keyboard focus inside the open dialog
      var f = sheetRoot.querySelectorAll('button, textarea, a[href], input');
      if (!f.length) return;
      var firstEl = f[0], lastEl = f[f.length - 1];
      if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
    }
  });

  /* ---------- Load-in screen ---------- */
  var SPLASH_KEY = 'wealthy-splash-seen';
  var BILL = '<svg viewBox="0 0 60 30" aria-hidden="true" focusable="false"><rect class="bill" x="1" y="1" width="58" height="28" rx="3"/><rect class="bill-line" x="5" y="5" width="50" height="20" rx="2"/><circle class="bill-line" cx="30" cy="15" r="7"/><path class="bill-mark" d="M32.6 12.3c-.6-.8-1.5-1.2-2.6-1.2-1.5 0-2.6.8-2.6 1.9 0 2.7 5.3 1.5 5.3 4.1 0 1.2-1.2 2-2.7 2-1.2 0-2.1-.5-2.8-1.3M30 9.6v1.5M30 19.1v1.4"/></svg>';
  var COIN = '<svg viewBox="0 0 30 30" aria-hidden="true" focusable="false"><circle class="coin" cx="15" cy="15" r="13.5"/><circle class="coin-line" cx="15" cy="15" r="10"/><path class="coin-mark" d="M17.6 12.3c-.6-.8-1.5-1.2-2.6-1.2-1.5 0-2.6.8-2.6 1.9 0 2.7 5.3 1.5 5.3 4.1 0 1.2-1.2 2-2.7 2-1.2 0-2.1-.5-2.8-1.3M15 9.6v1.5M15 19.1v1.4"/></svg>';
  function moneyHTML() {
    var out = '';
    for (var i = 0; i < 28; i++) {
      var isBill = Math.random() < 0.62;
      var w = isBill ? 40 + Math.random() * 26 : 18 + Math.random() * 12;
      var r0 = Math.round(Math.random() * 80 - 40);
      var r1 = r0 + Math.round(Math.random() * 360 - 180);
      out += '<span class="money" style="--x:' + (Math.random() * 94).toFixed(1) + '%;--w:' + Math.round(w) + 'px;--d:' + Math.round(Math.random() * 850) + 'ms;--t:' + Math.round(1300 + Math.random() * 700) + 'ms;--r0:' + r0 + 'deg;--r1:' + r1 + 'deg;--drift:' + Math.round(Math.random() * 60 - 30) + 'px">' + (isBill ? BILL : COIN) + '</span>';
    }
    return out;
  }
  function setInert(on) {
    ['app', 'tabbar', 'consent-root', 'sheet-root', 'pill-root'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.inert = on;
    });
    var skip = document.querySelector('.skip-link');
    if (skip) skip.inert = on;
  }
  // Plays once per visit (and after finishing sign-up). Tap or press Enter, Space or Escape to skip.
  function runSplash(force) {
    var seen = false;
    try { seen = sessionStorage.getItem(SPLASH_KEY) === '1'; } catch (e) {}
    var sp = document.getElementById('splash');
    if (!force && seen) { if (sp) sp.remove(); return; }
    if (!sp) {
      sp = document.createElement('div');
      sp.className = 'splash';
      sp.id = 'splash';
      sp.setAttribute('role', 'status');
      sp.setAttribute('aria-label', 'Loading Wealthy');
      sp.innerHTML = '<div class="splash-rain" aria-hidden="true"></div><div class="splash-mark" aria-hidden="true">' + bagSVG(92) + '<span class="splash-word">Wealthy</span></div>';
      document.body.appendChild(sp);
    }
    var reduce = reducedMotion();
    if (!reduce) sp.querySelector('.splash-rain').innerHTML = moneyHTML();
    setInert(true);
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      try { sessionStorage.setItem(SPLASH_KEY, '1'); } catch (e) {}
      document.removeEventListener('keydown', onKey, true);
      sp.classList.add('is-leaving');
      setTimeout(function () { sp.remove(); setInert(false); }, reduce ? 0 : 450);
    }
    function onKey(e) {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); finish(); }
    }
    sp.addEventListener('click', finish);
    document.addEventListener('keydown', onKey, true);
    setTimeout(finish, reduce ? 600 : 2300);
  }

  window.addEventListener('hashchange', render);
  UI.queue = INCOMING.slice();
  setInterval(feedTick, 7000);
  // A Global Privacy Control signal counts as "Essential only" without asking.
  if (!C && navigator.globalPrivacyControl === true) saveConsent(false);
  if (C && C.analytics) loadAnalytics();
  render();
  runSplash(false);
})();
</script>
</body>
</html>
